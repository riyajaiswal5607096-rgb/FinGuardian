<html>
<head>
	<title>Dashboard</title>
	<link rel="stylesheet" href="/static/style.css">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

	<h1 style="text-align:center;">Powered Dashboard</h1>

	<!-- 🔥 Monthly Summary Section -->
	<div style="text-align:center; border:1px solid #ccc; padding:15px; margin:20px;">
		<h2>Monthly Summary</h2>
		<p><b>Total Spent:</b> ₹{{ total }}</p>
		<p><b>Remaining Budget:</b> ₹{{ remaining }}</p>
	</div>

	<!-- AI Message -->
	<h3 style="color: yellow; text-align: center;">
		{{ ai_message }}
	</h3>

	<!-- Expense Table -->
	<table border="1" align="center">
		<tr>
			<th>Amount</th>
			<th>Category</th>
		</tr>
		{% for e in expenses %}
		<tr>
			<td>{{ e[1] }}</td>
			<td>{{ e[2] }}</td>
		</tr>
		{% endfor %}
	</table>

	<br>

	<!-- Chart -->
	<h2 style="text-align:center;">Category-wise Expenses Chart</h2>
	<div style="width:400px; margin:auto;">
		<canvas id="myChart"></canvas>
	</div>

	<script>
		const labels = {{ categories.keys() | list }};
		const values = {{ categories.values() | list }};

		new Chart(document.getElementById("myChart"), {
			type: "pie",
			data: {
				labels: labels,
				datasets: [{
					data: values
				}]
			},
			options: {
				responsive: true,
				maintainAspectRatio: false
			}
		});
	</script>

	<br>

	<div style="text-align:center;">
		<a href="/add">Add more</a>
	</div>

</body>
</html>
